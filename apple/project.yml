# HIM for iPhone and iPad. `xcodegen` makes HIM.xcodeproj from this (the project isn't
# kept in git); the app's code is the HIMKit package in this folder.
name: HIM
options:
  bundleIdPrefix: com.tagban
  deploymentTarget:
    iOS: "17.0"
packages:
  HIMKit:
    path: .
targets:
  HIM:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: HIMKit
        product: HIMKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tagban.him.modern
        PRODUCT_NAME: HIM
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HIM
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: D36X678376
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"

# Windows and Linux builds. Pushing a v* tag builds everything and gathers it into
# a draft release; the Mac builds are signed and notarized on a Mac and added to it.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p hotline-im --all-features

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (NSIS installer and MSI)
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libdbus-1-dev libxdo-dev pkg-config file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Build (.deb)
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/release/bundle/deb/*.deb

  flatpak:
    needs: linux
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: debs
      - run: cp debs/*.deb packaging/flatpak/him.deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: HIM_${{ github.ref_name }}_${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/com.tagban.him.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, windows, linux, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - run: find out -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: HIM ${{ github.ref_name }}
          files: |
            out/windows/**/*.exe
            out/windows/**/*.msi
            out/deb-*/*.deb
            out/**/*.flatpak

[package]
name = "hotline-im"
version = "0.1.0"
license = "MIT"
description = "Client side of the Hotline Instant Messaging extension (framing, HOPE, AEAD, messaging)"
edition = "2021"
publish = false

[features]
# the in-memory test server (src/mock.rs, bin mock-server)
mock-server = []

[[bin]]
name = "mock-server"
required-features = ["mock-server"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.5"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
encoding_rs = "0.8"
rand = "0.8"
socket2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode_names2 = "4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# the integration tests drive the mock server
hotline-im = { path = ".", features = ["mock-server"] }

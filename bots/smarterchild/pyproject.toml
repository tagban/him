[project]
name = "smarterchild"
version = "0.1.0"
description = "SmarterChild for the Hotline IM network: a buddy that answers questions and plays games"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
smarterchild = "smarterchild.bot:main"
bugbot = "smarterchild.bugbot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["smarterchild"]

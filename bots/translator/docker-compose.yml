# The Translator on a server: `docker compose up -d --build`, logs with `docker compose logs -f`.
# It runs from SmarterChild's code (the same Hotline client) and translates with Google
# Translate's free endpoint (TRANSLATE_ENGINE=libre and TRANSLATE_URL for a LibreTranslate
# server instead). Its settings and password go in .env beside this file (see .env.example).
services:
  translator:
    build: ../smarterchild
    image: translator:local
    container_name: translator
    command: ["translator"]
    restart: unless-stopped
    env_file: .env
    environment:
      TRANSLATOR_DATA: /data
    volumes:
      - ./data:/data
    # A Hotline server on this same machine (HUB_HOST=host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
